<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d6ebe6">
<title>指毛ぬき</title>
<link rel="stylesheet" href="fonts/dela-gothic-one/400.css">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new/500.css">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new/700.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
html[lang="zh"]{--display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
html[lang="zh"] .card h1,html[lang="zh"] .card h2,html[lang="zh"] .big,html[lang="zh"] button.go,html[lang="zh"] .stat b{font-weight:900}
html[lang="ko"]{--display:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;--body:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif}
html[lang="ko"] .card h1,html[lang="ko"] .card h2,html[lang="ko"] .big,html[lang="ko"] button.go,html[lang="ko"] .stat b{font-weight:900}
/* Layout: one-screen game — thin HUD on top, bathroom-tile stage with a big hand filling the rest. Single committed light look. */
:root{
  --tile:#d6ebe6; --grout:#bfd9d2; --ink:#1f2b33; --muted:#5c6f73;
  --skin:#f1c7a2; --pain:#e0412f; --gold:#d6a01e; --card:#fbfdfc;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--tile);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none}
.hud{display:grid;grid-template-columns:auto auto 1fr auto;gap:16px;align-items:center;padding-block:4px 8px}
.stat{display:flex;flex-direction:column;line-height:1}
.stat small{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.pain{min-width:0}
.zm{color:var(--pain);letter-spacing:0}
.bar{height:14px;border-radius:7px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pain);transition:width .12s linear}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;border-radius:14px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(31,43,51,.28)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:22px 22px 20px;max-width:360px;width:100%;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:40px;line-height:1.05}
.card h2{font-size:28px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.card ul{margin:0;padding-left:1.1em;font-size:14px;line-height:1.7}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){font-weight:700;text-align:right}
.rank{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.btns{display:flex;gap:8px}
.btns>button{flex:1}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;background:#fff;color:var(--ink)}
button.go{flex:1;background:var(--pain);color:#fff;font-family:var(--display);font-weight:400;font-size:20px}
button:active{transform:translate(2px,2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.best{font-size:12px;color:var(--muted)}
.next{font-size:13px;color:var(--muted);margin-top:-6px}
.tag{color:var(--pain)}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.card{box-sizing:border-box;max-height:100%;overflow:auto}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px}
.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuGrid button{padding:10px 4px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.back{align-self:flex-start;padding:8px 14px;font-size:14px}
.rankList{display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border:2px solid transparent;border-radius:10px;font-size:14px;color:var(--muted)}
.rrow b{font-weight:700}
.rrow .lo{font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow.got{color:var(--ink)}
.rrow.cur{border-color:var(--ink);background:#fff}
.rank.special{background:var(--pain)}
.ov.home{flex-direction:column;justify-content:space-between;align-items:stretch;background:transparent;pointer-events:none;padding:12px}
.ov.home .card{pointer-events:auto;max-width:420px;margin:0 auto;width:100%;box-sizing:border-box}
.homeTop{transform:rotate(-1.5deg);gap:6px;padding:16px 20px}
.homeTop h1{font-size:46px}
.homeDock{gap:10px}
.homeDock .best{text-align:right}
button.go.big{font-size:26px;padding:16px}
.menuGrid button{display:flex;align-items:center;justify-content:center;gap:6px}
.menuGrid svg{width:18px;height:18px;flex:none}
.tut{text-align:center}
.tutArt{background:var(--tile);border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;padding:8px;touch-action:pan-y}
.tutArt svg{width:100%;max-width:240px;height:auto;display:block}
.tut h2{font-size:24px}
.tut p{color:var(--ink);min-height:4.8em}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--grout);transition:width .2s}
.dots i.on{background:var(--ink);width:22px}
.lvbox{display:flex;flex-direction:column;gap:4px}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.lvrow b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.lvbar{height:8px;border-radius:4px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.lvbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s ease}
.gain{font-size:13px;font-weight:700;color:var(--muted)}
.gain.up{color:var(--gold)}
.spHead{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rrow.sp{flex-direction:column;gap:2px}
.rrow .cond{font-size:12px}
.lang button{padding:5px 10px;font-size:13px;border-width:2px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
</style>

</head>
<body>
<div class="hud">
  <div class="stat"><small data-i="score">スコア</small><b id="sc">0</b></div>
  <div class="stat"><small data-i="time">のこり</small><b id="tm">45.0</b></div>
  <div class="stat pain"><small data-i="pain">いたみ</small><div class="bar"><i id="pb"></i></div></div>
  <button class="iconbtn" id="pauseBtn" aria-label="Pause" hidden><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="9" y="1" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="ov home" id="ovTitle">
    <div class="card homeTop">
      <h1 data-i="title">指毛<br>ぬき</h1>
      <p data-i="lead"></p>
    </div>
    <div class="card homeDock">
      <div class="lvbox"><div class="lvrow"><b id="mLv">Lv.1</b><span id="mLvN"></span></div><div class="lvbar"><i id="mLvB"></i></div><div class="best" id="bestT"></div></div>
      <button class="go big" id="start" data-i="start">はじめる</button>
      <div class="menuGrid">
        <button id="toHow"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.4 7.6a2.7 2.7 0 1 1 3.8 2.4c-.8.4-1.2.9-1.2 1.8v.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.9" r="1.2" fill="currentColor"/></svg><span data-i="how">遊び方</span></button>
        <button id="toSet"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="5" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="10" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="15" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/></svg><span data-i="settings">設定</span></button>
      </div>
    </div>
  </div>
  <div class="ov" id="ovHow" hidden>
    <div class="card tut" id="tutCard">
      <div class="tutArt" id="tutArt"></div>
      <h2 id="tutT"></h2>
      <p id="tutB"></p>
      <div class="dots" id="tutDots"></div>
      <div class="btns"><button id="tutSkip">スキップ</button><button class="go" id="tutNext">次へ</button></div>
    </div>
  </div>
  <div class="ov" id="ovSet" hidden>
    <div class="card">
      <h2 data-i="settings">設定</h2>
      <div class="field"><span data-i="langL">言語</span>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">中文</button><button data-lang="ko">한국어</button>
        </div>
      </div>
      <div class="field"><span data-i="soundL">音</span>
        <div class="lang"><button id="snd">音 ON</button></div>
      </div>
      <button class="back" data-back data-i="back">もどる</button>
    </div>
  </div>
  <div class="ov" id="ovRevive" hidden>
    <div class="card">
      <h2 data-i="revT">時間切れ!</h2>
      <p data-i="revP"></p>
      <button class="go" id="revWatch" data-i="revWatch">広告を見て+10秒</button>
      <button class="go" id="revResume" data-i="revResume" hidden>再開する</button>
      <button id="revNo" data-i="revNo">やめる</button>
      <p class="best" id="revMsg"></p>
    </div>
  </div>
  <div class="ov" id="ovPause" hidden>
    <div class="card">
      <h2 data-i="paused">一時停止</h2>
      <button class="go" id="resume" data-i="resume">つづける</button>
      <div class="btns"><button id="retry" data-i="retry">やりなおす</button><button id="toMenu" data-i="menu">メニュー</button></div>
    </div>
  </div>
  <div class="ov" id="ovEnd" hidden>
    <div class="card">
      <h2 id="reason"></h2>
      <div class="big" id="fScore">0</div>
      <span class="rank" id="rank"></span>
      <span class="next" id="nextR"></span>
      <div class="rows">
        <span data-i="rN">抜いた本数</span><span id="rN">0</span>
        <span data-i="rP">スパッ!</span><span id="rP">0</span>
        <span data-i="rC">最大コンボ</span><span id="rC">0</span>
        <span data-i="rBk">ちぎれた回数</span><span id="rBk">0</span>
        <span data-i="rB">ベスト</span><span id="rB">0</span>
      </div>
      <div class="lvbox"><div class="lvrow"><b id="eLv">Lv.1</b><span id="eLvN"></span></div><div class="lvbar"><i id="eLvB"></i></div><span class="gain" id="eGain"></span></div>
      <div class="btns"><button class="go" id="again" data-i="again">もう一回</button><button id="endMenu" data-i="menu">メニュー</button></div>
    </div>
  </div>
</div>

function beep(freq,dur,type,vol){

let perfNow=0;

/* ---------- game logic ---------- */
function popup(text,x,y,col,size){pops.push({text,x,y,col,size:size||22,life:1});}
function addPain(v){v*=0.85;if(iceT>0)v*=0.5;if(feverT>0)v*=0.5;pain=Math.min(100,pain+v);shake=Math.max(shake,v*0.6);if(pain>=100&&state==='play')end(L.painOut);}
function pluck(h,ms){
  if(tweezT>0)ms=0;
  const [rx,ry]=root(h);
  const base=h.kind==='thick'?12:h.kind==='gold'?8:6, pts=h.kind==='thick'?25:h.kind==='gold'?100:10;
  const dx=grab.px-rx,dy=grab.py-ry,dl=Math.hypot(dx,dy)||1;
  const dot=(dx*Math.cos(h.ang)+dy*Math.sin(h.ang))/dl;
  let dirM=1,dirT=null;
  if(dot>0.75){dirM=0.5;dirT=L.grain;}else if(dot<-0.3){dirM=2.2;dirT=L.against;}
  const br=(h.stub||tweezT>0)?0:(dot<-0.3?0.45:dot>0.75?0.03:0.15)+(h.kind==='thick'?0.1:0);
  if(Math.random()<br){breakHair(h,rx,ry,dx,dy,dl);return;}
  hairs.splice(hairs.indexOf(h),1);
  let label,col,mult;
  if(ms<220){label=L.snap;col=C.ink;mult=0.4;combo++;perfect++;beep(900,0.09,'square',0.07);}
  else if(ms<550){label=L.ok;col=C.muted||'#5c6f73';mult=1;combo++;beep(600,0.1,'square',0.06);}
  else{label=L.ouch;col=C.pain;mult=1.9;combo=0;beep(180,0.25,'sawtooth',0.08);}
  maxCombo=Math.max(maxCombo,combo);plucked++;
  if(combo>0&&combo%25===0&&feverT<=0)startFever();
  const hot=heat[h.f]>=2.5,hm=1+Math.max(0,heat[h.f]-2)*0.35;heat[h.f]+=1;
  const pv=base*mult*dirM*hm;addPain(pv);
  const plus=Math.round(pts*(1+Math.min(combo,20)*0.1)),minus=Math.round(pv*2.5),gain=plus-minus;score+=gain;
  popup(label,rx,ry-30,col,label===L.snap?26:22);
  if(dirT)popup(dirT,rx,ry-54,dirM<1?'#2f8a5a':C.pain,16);
  popup((gain>=0?'+':'')+gain,rx,ry-6,gain<0?C.pain:h.kind==='gold'?C.gold:C.ink,gain<0?19:16);
  if(h.kind==='gold'&&feverT<=0)popup(L.gold,W/2,H*0.18,C.gold,30);
  const sp=ms<220?9:5;
  parts.push({x:grab.px,y:grab.py,vx:dx/dl*sp+rnd(-1,1),vy:dy/dl*sp-2,rot:Math.atan2(ry-grab.py,rx-grab.px),vr:rnd(-0.3,0.3),len:h.len*u,kind:h.kind,bulb:ms<550,life:1.6});
  scars.push({f:h.f,fx:h.fx,fy:h.fy,life:1});
}
function breakHair(h,rx,ry,dx,dy,dl){
  const old=h.len;h.len=Math.max(1.8,old*0.28);h.stub=true;h.grow=1;
  combo=0;addPain(3);score-=5;broken++;
  pops=pops.filter(p=>Math.hypot(p.x-rx,p.y-ry)>70);popup(L.broke+' -5',rx,ry-34,C.pain,27);h.flash=1.4;shake=Math.max(shake,5);
  parts.push({x:grab.px,y:grab.py,vx:dx/dl*4,vy:dy/dl*4-2,rot:Math.atan2(ry-grab.py,rx-grab.px),vr:rnd(-0.3,0.3),len:(old-h.len)*u,kind:h.kind,bulb:false,life:1.4});
  beep(260,0.12,'square',0.07);
}
function startFever(){
  feverT=6;for(const h of hairs)h.kind='gold';
  popup(L.fever,W/2,H*0.3,C.gold,40);shake=Math.max(shake,6);
  [880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.06),i*80));
}
function drawSting(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<4;i++){if(heat[i]<2.5)continue;const f=fingers[i];
    const a=Math.min(1,(heat[i]-2.4)*1.5),fs=Math.max(10,2.9*u);
    ctx.globalAlpha=a;ctx.font=`700 ${fs}px "Zen Kaku Gothic New","Noto Sans SC",sans-serif`;
    const y=f.by+9*u+Math.sin(perfNow/90+i)*0.6*u;
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.strokeText(L.sting,f.x,y);ctx.fillStyle=C.pain;ctx.fillText(L.sting,f.x,y);}
  ctx.globalAlpha=1;
}
function spawnItem(){
  const kinds=['cream','ice','tweez','tonic'],k=kinds[Math.floor(Math.random()*4)];
  const top=Math.min(...fingers.map(f=>f.by-f.L));
  const side=Math.random()<0.5;let x,y;
  if(top>110){x=rnd(40,W-40);y=rnd(50,top-30);}
  else{x=side?rnd(30,Math.max(31,fingers[0].x-fingers[0].w)):rnd(Math.min(W-31,fingers[3].x+fingers[3].w),W-30);y=rnd(60,H*0.6);}
  items.push({k,x,y,life:5,ph:Math.random()*6});beep(1400,0.08,'sine',0.04);
}
function useItem(it){
  items.splice(items.indexOf(it),1);beep(700,0.06,'triangle',0.07);setTimeout(()=>beep(1050,0.1,'triangle',0.07),70);
  popup(L[it.k],it.x,it.y-20,'#2b6f9a',18);
  if(it.k==='ice'){pain=Math.max(0,pain-40);iceT=6;}
  else if(it.k==='tonic'){let f=0;for(let i=1;i<4;i++){const ci=hairs.filter(h=>h.f===i).length,cf=hairs.filter(h=>h.f===f).length;if(heat[i]<heat[f]-0.3||(Math.abs(heat[i]-heat[f])<=0.3&&ci<cf))f=i;}for(let n=0;n<7;n++){const h=newHair(false);h.f=f;hairs.push(h);}const fg=fingers[f];popup(L.sprout,fg.x,fg.by-fg.L*0.85,'#2f8a5a',20);}
  else if(it.k==='tweez'){tweezT=6;}
  else{
    const cnt=[0,0,0,0];for(const h of hairs)if(!h.creamed&&h.grow>=0.5)cnt[h.f]++;
    let f=cnt.indexOf(Math.max(...cnt));if(cnt[f]===0)f=Math.floor(Math.random()*4);
    for(const h of hairs)if(h.f===f&&!h.creamed){h.creamed=true;h.fade=1;}
    creams.push({f,t:1.6});
  }
}
function finishCream(c){
  const hs=hairs.filter(h=>h.creamed&&h.f===c.f);let g=0;
  for(const h of hs){g+=h.kind==='thick'?25:h.kind==='gold'?100:10;hairs.splice(hairs.indexOf(h),1);plucked++;}
  score+=g;const f=fingers[c.f];popup(L.smooth+' +'+g,f.x,f.by-f.L*0.85,'#2f8a5a',20);beep(1300,0.15,'sine',0.06);
}
function drawItems(){
  for(const it of items){
    if(it.life<1.5&&Math.floor(it.life*8)%2)continue;
    const y=it.y+Math.sin(perfNow/300+it.ph)*4;
    ctx.save();ctx.translate(it.x,y);
    ctx.fillStyle='#fff';ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();ctx.stroke();
    ctx.lineWidth=2;
    if(it.k==='cream'){ctx.rotate(-0.6);ctx.fillStyle='#fdf6f9';ctx.beginPath();ctx.roundRect(-13,-6,20,12,3);ctx.fill();ctx.stroke();
      ctx.fillStyle='#f27ea0';ctx.beginPath();ctx.roundRect(7,-4,7,8,2);ctx.fill();ctx.stroke();ctx.fillStyle='#f27ea0';ctx.fillRect(-9,-2,9,4);}
    else if(it.k==='tonic'){ctx.fillStyle='#8fd6a0';ctx.beginPath();ctx.roundRect(-9,-6,18,18,4);ctx.fill();ctx.stroke();ctx.fillStyle='#2f8a5a';ctx.beginPath();ctx.roundRect(-5,-13,10,8,2);ctx.fill();ctx.stroke();ctx.strokeStyle='#2f8a5a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,6);ctx.quadraticCurveTo(-3,0,0,-1);ctx.moveTo(3,6);ctx.quadraticCurveTo(3,1,6,0);ctx.stroke();}
    else if(it.k==='ice'){ctx.fillStyle='#bfe6ff';ctx.beginPath();ctx.roundRect(-13,-11,26,22,6);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=2.4;for(let a=0;a<3;a++){ctx.beginPath();ctx.moveTo(Math.cos(a*1.047)*7,Math.sin(a*1.047)*7);ctx.lineTo(-Math.cos(a*1.047)*7,-Math.sin(a*1.047)*7);ctx.stroke();}}
    else{ctx.strokeStyle='#7d8b97';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-2,-14);ctx.lineTo(-5,13);ctx.moveTo(2,-14);ctx.lineTo(5,13);ctx.stroke();
      ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-14,3,0,7);ctx.stroke();}
    ctx.restore();
  }
}
function update(dt){
  perfNow+=dt*1000;
  shake=Math.max(0,shake-dt*40);
  for(const h of hairs)if(h.flash>0)h.flash-=dt;
  for(const h of hairs)if(h.grow<1)h.grow=Math.min(1,h.grow+dt*3.5);
  for(const p of parts){p.vy+=dt*30;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.rot+=p.vr;p.life-=dt;}
  parts=parts.filter(p=>p.life>0&&p.y<H+50);
  for(const p of pops){p.y-=dt*28;p.life-=dt*0.9;}pops=pops.filter(p=>p.life>0);
  for(const s of scars)s.life-=dt*0.35;scars=scars.filter(s=>s.life>0);
  for(let i=0;i<4;i++)heat[i]=Math.max(0,heat[i]-dt*0.8);
  if(state==='ready'){const was=readyT;readyT-=dt;if(was>0.6&&readyT<=0.6)beep(1320,0.25,'square',0.08);if(readyT<=0)state='play';return;}
  if(state!=='play')return;
  time=Math.max(0,time-dt);
  if(grab){
    const held=(performance.now()-grab.t0)/1000;
    if(held>0.6){pain=Math.min(100,pain+dt*19*(feverT>0?0.5:1));score-=dt*20;shake=Math.max(shake,1.5);}
  }else pain=Math.max(0,pain-dt*8);
  itemT-=dt;
  if(itemT<=0&&!items.length){spawnItem();itemT=rnd(8,12);}
  for(const it of items)it.life-=dt;items=items.filter(it=>it.life>0);
  if(feverT>0){feverT-=dt;if(feverT<=0){feverT=0;for(const h of hairs)h.kind=h.orig||h.kind;}}
  iceT=Math.max(0,iceT-dt);tweezT=Math.max(0,tweezT-dt);
  for(const h of hairs)if(h.creamed)h.fade-=dt/1.6;
  for(const c of creams){c.t-=dt;if(c.t<=0)finishCream(c);}creams=creams.filter(c=>c.t>0);
  spawnT-=dt;
  if(spawnT<=0&&hairs.length<26){const n=hairs.length;hairs.push(newHair(false));if(n<8)hairs.push(newHair(false));spawnT=(n<8?rnd(0.06,0.14):n<16?rnd(0.15,0.3):rnd(0.3,0.55))*(feverT>0?0.5:1);}
  if(pain>=100)end(L.painOut);
  else if(time<=0)end(L.timeUp);
  $('sc').textContent=Math.round(score);$('tm').textContent=time.toFixed(1);$('pb').style.width=pain+'%';
}
function end(reason){
  if(reason===L.timeUp&&!revived&&adsReady&&rReady){offerRevive();return;}
  state='over';grab=null;score=Math.round(score);beep(220,0.4,'triangle',0.08);
  if(score>best){best=score;try{localStorage.setItem('yubige-best',best)}catch(e){}}
  const ranks=[0,3000,5000,7500,10000,13000,16000,20000,25000,32000,40000,1e9].map((v,i)=>[v,L.ranks[i]]);
  const ri=ranks.findIndex(r=>score<r[0]);$('nextR').textContent=ri<ranks.length-1?L.next(ranks[ri][0]-score,ranks[ri+1][1]):'';
  $('reason').textContent=reason;$('fScore').textContent=score;$('rank').textContent=ranks.find(r=>score<r[0])[1];
  const si=SPECIAL.findIndex(f=>f(reason));$('rank').classList.toggle('special',si>=0);
  if(si>=0){$('rank').textContent=L.sp[si][0];$('nextR').textContent=L.spGet;if(!spGot.includes(si)){spGot.push(si);try{localStorage.setItem('yubige-sp',JSON.stringify(spGot))}catch(e){}}}
  $('rBk').textContent=L.times(broken);
  const up=commitPlucks();renderLevel('e');$('eGain').textContent=L.gained(plucked)+(up>0?'   '+L.lvUp(lvInfo(total).lv):'');$('eGain').classList.toggle('up',up>0);
  $('rN').textContent=L.hairs(plucked);$('rP').textContent=L.times(perfect);$('rC').textContent=maxCombo;$('rB').textContent=best;
  $('pb').style.width=pain+'%';$('sc').textContent=score;$('tm').textContent=time.toFixed(1);
  $('pauseBtn').hidden=true;renderRanks();
  gamesSinceAd++;
  if(adsReady&&iReady&&!revived&&gamesSinceAd>=ADS.every){gamesSinceAd=0;iReady=false;setTimeout(()=>{adCall('showInterstitial').catch(()=>{}).finally(prepI);},400);}
  setTimeout(()=>{if(state==='over')show('ovEnd');},500);
}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy||1;let t=((px-ax)*vx+(py-ay)*vy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-vx*t,py-ay-vy*t);}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const [x,y]=pos(e);let bestH=null,bd=Math.max(18,4*u)*(tweezT>0?1.6:1);
  for(const it of items)if(Math.hypot(x-it.x,y-it.y)<30){useItem(it);return;}
  for(const h of hairs){if(h.grow<0.5||h.creamed)continue;const g=hairGeom(h);const d=segDist(x,y,g.rx,g.ry,g.tx,g.ty)/(h.stub?0.55:1);if(d<bd){bd=d;bestH=h;}}
  if(bestH){grab={h:bestH,t0:performance.now(),px:x,py:y};cv.setPointerCapture(e.pointerId);beep(1200,0.03,'sine',0.03);}
});
cv.addEventListener('pointermove',e=>{
  if(!grab)return;const [x,y]=pos(e);grab.px=x;grab.py=y;
  const [rx,ry]=root(grab.h);
  if(Math.hypot(x-rx,y-ry)>=reqDist(grab.h)){pluck(grab.h,performance.now()-grab.t0);grab=null;}
});
function release(){
  if(!grab)return;const [rx,ry]=root(grab.h);
  if(Math.hypot(grab.px-rx,grab.py-ry)>reqDist(grab.h)*0.45){addPain(4);combo=0;score-=10;popup(L.stuck+' -10',rx,ry-24,C.pain,20);beep(150,0.15,'sawtooth',0.06);}
  grab=null;
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

let tutI=0,tutFirst=false;
function renderTut(){const n=L.tut.length,s=L.tut[tutI];$('tutArt').innerHTML=TUT_ART[tutI];$('tutT').textContent=s[0];$('tutB').textContent=s[1];
  $('tutDots').innerHTML=L.tut.map((_,i)=>`<i class="${i===tutI?'on':''}"></i>`).join('');
  $('tutNext').textContent=tutI<n-1?L.tutNext:(tutFirst?L.tutGo:L.back);$('tutSkip').textContent=L.tutSkip;$('tutSkip').style.visibility=tutI<n-1?'visible':'hidden';}
function openTut(first){tutI=0;tutFirst=first;renderTut();show('ovHow');}
function closeTut(go){try{localStorage.setItem('yubige-tut','1')}catch(e){}if(go)start();else show('ovTitle');}
$('tutNext').onclick=()=>{if(tutI<L.tut.length-1){tutI++;renderTut();}else closeTut(tutFirst);};
$('tutSkip').onclick=()=>closeTut(false);
(function(){let sx=null;const c=$('tutCard');c.addEventListener('pointerdown',e=>{sx=e.clientX});c.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)<50)return;if(dx<0&&tutI<L.tut.length-1)tutI++;else if(dx>0&&tutI>0)tutI--;else return;renderTut();});})();
setTimeout(initAds,800);

$('start').onclick=start;$('again').onclick=start;$('retry').onclick=start;
$('pauseBtn').onclick=pause;$('resume').onclick=resume;$('toMenu').onclick=toMenu;$('endMenu').onclick=toMenu;
$('toHow').onclick=()=>openTut(false);$('toSet').onclick=()=>show('ovSet');
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('ovTitle'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state==='play')pause();else if(state==='pause')resume();else if(state==='title')show('ovTitle');}});
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?L.sndOn:L.sndOff;};
applyLang();
try{if(!localStorage.getItem('yubige-tut'))openTut(true);}catch(e){openTut(true);}

let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(state!=='pause')update(dt);draw();requestAnimationFrame(loop);}
new ResizeObserver(resize).observe($('stage'));resize();requestAnimationFrame(loop);
})();
