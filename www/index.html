<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d6ebe6">
<title>指毛ぬき</title>
<link rel="stylesheet" href="fonts/dela-gothic-one/400.css">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new/500.css">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new/700.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html[lang="zh"]{--display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
html[lang="zh"] .card h1,html[lang="zh"] .card h2,html[lang="zh"] .big,html[lang="zh"] button.go,html[lang="zh"] .stat b{font-weight:900}
html[lang="ko"]{--display:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;--body:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif}
html[lang="ko"] .card h1,html[lang="ko"] .card h2,html[lang="ko"] .big,html[lang="ko"] button.go,html[lang="ko"] .stat b{font-weight:900}
/* Layout: one-screen game — thin HUD on top, bathroom-tile stage with a big hand filling the rest. Single committed light look. */
:root{
  --tile:#d6ebe6; --grout:#bfd9d2; --ink:#1f2b33; --muted:#5c6f73;
  --skin:#f1c7a2; --pain:#e0412f; --gold:#d6a01e; --card:#fbfdfc;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box}
html,body{height:100%}
body{background:var(--tile);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none}
.hud{display:grid;grid-template-columns:auto auto 1fr auto;gap:16px;align-items:center;padding-block:4px 8px}
.stat{display:flex;flex-direction:column;line-height:1}
.stat small{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.pain{min-width:0}
.zm{color:var(--pain);letter-spacing:0}
.bar{height:14px;border-radius:7px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pain);transition:width .12s linear}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;border-radius:14px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(31,43,51,.28)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:22px 22px 20px;max-width:360px;width:100%;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:40px;line-height:1.05}
.card h2{font-size:28px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.card ul{margin:0;padding-left:1.1em;font-size:14px;line-height:1.7}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){font-weight:700;text-align:right}
.rank{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.btns{display:flex;gap:8px}
.btns>button{flex:1}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;background:#fff;color:var(--ink)}
button.go{flex:1;background:var(--pain);color:#fff;font-family:var(--display);font-weight:400;font-size:20px}
button:active{transform:translate(2px,2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.best{font-size:12px;color:var(--muted)}
.next{font-size:13px;color:var(--muted);margin-top:-6px}
.tag{color:var(--pain)}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.card{box-sizing:border-box;max-height:100%;overflow:auto}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px}
.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuGrid button{padding:10px 4px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.back{align-self:flex-start;padding:8px 14px;font-size:14px}
.rankList{display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border:2px solid transparent;border-radius:10px;font-size:14px;color:var(--muted)}
.rrow b{font-weight:700}
.rrow .lo{font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow.got{color:var(--ink)}
.rrow.cur{border-color:var(--ink);background:#fff}
.rank.special{background:var(--pain)}
.ov.home{flex-direction:column;justify-content:space-between;align-items:stretch;background:transparent;pointer-events:none;padding:12px}
.ov.home .card{pointer-events:auto;max-width:420px;margin:0 auto;width:100%;box-sizing:border-box}
.homeTop{transform:rotate(-1.5deg);gap:6px;padding:16px 20px}
.homeTop h1{font-size:46px}
@media (max-height:720px){.homeTop{padding:12px 16px}.homeTop h1{font-size:34px}.homeTop p{display:none}.homeDock{gap:8px;padding:16px}button.go.big{padding:12px;font-size:22px}}
.homeDock{gap:10px}
.homeDock .best{text-align:right}
button.go.big{font-size:26px;padding:16px}
.menuGrid button{display:flex;align-items:center;justify-content:center;gap:6px}
.menuGrid svg{width:18px;height:18px;flex:none}
.tut{text-align:center}
.tutArt{background:var(--tile);border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;padding:8px;touch-action:pan-y}
.tutArt svg{width:100%;max-width:240px;height:auto;display:block}
.tut h2{font-size:24px}
.tut p{color:var(--ink);min-height:4.8em}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--grout);transition:width .2s}
.dots i.on{background:var(--ink);width:22px}
.lvbox{display:flex;flex-direction:column;gap:4px}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.lvrow b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.lvbar{height:8px;border-radius:4px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.lvbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s ease}
.gain{font-size:13px;font-weight:700;color:var(--muted)}
.gain.up{color:var(--gold)}
.stock{font-size:12px;font-weight:700;color:#2f8a5a}
.tray{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;z-index:4}
.trayBtn{width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.trayBtn svg{width:30px;height:30px}
.adbtn{background:var(--gold);color:var(--ink);font-size:14px;padding:10px 12px}
.adbtn:disabled{opacity:.7}
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--ink);font-size:15px;padding:10px 12px}
.sharebtn svg{width:18px;height:18px;flex:none}
.sharebtn:disabled{opacity:.6}
.endOv{flex-direction:column;justify-content:flex-end;align-items:center;gap:0;padding:8px 12px 12px;background:rgba(31,43,51,.35)}
.endTop{flex:1;min-height:0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
#endFace{flex:1;min-height:0;width:100%;display:block}
.say{position:relative;z-index:2;margin:-6px 0 -12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-family:var(--display);font-size:18px;line-height:1.3;text-align:center;max-width:94%;box-shadow:3px 3px 0 var(--ink)}
.say::before{content:"";position:absolute;left:50%;top:-11px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom:11px solid var(--ink)}
.say::after{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:8px solid #fff}
.endCard{max-width:420px;gap:8px;padding:22px 18px 16px;text-align:center;align-items:stretch;flex:none}
.endHead{display:flex;justify-content:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.endCard .big{font-size:58px}
.endCard .rank{align-self:center;background:none;color:var(--pain);font-family:var(--display);font-weight:400;font-size:32px;padding:0;line-height:1.15;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-wrap:balance}
.endCard .rank.special{background:none;color:var(--gold)}
.endCard .next{margin-top:-4px}
.endCard .rows{grid-template-columns:1fr auto 1fr auto;gap:2px 10px;font-size:13px;text-align:left}
.endCard .lvbox{text-align:left}
.shareRow{display:flex;gap:8px}
.shareRow>button{flex:1}
.xbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;font-size:14px;padding:10px 8px;white-space:nowrap}
.shareRow .sharebtn{font-size:14px;padding:10px 8px;gap:6px;white-space:nowrap}
.xbtn svg{width:16px;height:16px;flex:none}
.imgCard{max-width:520px;align-items:center;text-align:center}
.imgCard img{width:100%;height:auto;border:2px solid var(--ink);border-radius:10px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
@media (max-height:700px){.endCard .big{font-size:44px}.endCard .rank{font-size:26px}.endCard{gap:6px;padding:18px 14px 12px}.say{font-size:15px}}
#toSet{grid-column:1/-1}
#toSkin{position:relative}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pain);border:2px solid var(--ink)}
.skinCard{gap:10px;padding:16px 18px}
.skinCard h2{font-size:22px}
.skRow{display:flex;align-items:center;gap:8px}
.skRow>span{width:3.4em;flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.skSw{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border-width:3px;display:grid;place-items:center;color:#fff;position:relative;font-size:15px}
.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.sw.lock::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(31,43,51,.6)}
.sw svg,.sw b{position:relative}
.skMsg{font-size:13px;color:var(--pain);min-height:1.5em;font-weight:700}
.spHead{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rrow.sp{flex-direction:column;gap:2px}
.rrow .cond{font-size:12px}
.lang button{padding:5px 10px;font-size:13px;border-width:2px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
</style>

</head>
<body>
<div class="hud">
  <div class="stat"><small data-i="score">スコア</small><b id="sc">0</b></div>
  <div class="stat"><small data-i="time">のこり</small><b id="tm">45.0</b></div>
  <div class="stat pain"><small data-i="pain">いたみ</small><div class="bar"><i id="pb"></i></div></div>
  <button class="iconbtn" id="pauseBtn" aria-label="Pause" hidden><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="9" y="1" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="tray" id="tray" hidden></div>
  <div class="ov home" id="ovTitle">
    <div class="card homeTop">
      <h1 data-i="title">指毛<br>ぬき</h1>
      <p data-i="lead"></p>
    </div>
    <div class="card homeDock">
      <div class="lvbox"><div class="lvrow"><b id="mLv">Lv.1</b><span id="mLvN"></span></div><div class="lvbar"><i id="mLvB"></i></div><div class="best" id="bestT"></div><div class="stock" id="mStock" hidden></div></div>
      <button class="go big" id="start" data-i="start">はじめる</button>
      <div class="menuGrid">
        <button id="toHow"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.4 7.6a2.7 2.7 0 1 1 3.8 2.4c-.8.4-1.2.9-1.2 1.8v.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.9" r="1.2" fill="currentColor"/></svg><span data-i="how">遊び方</span></button>
        <button id="toSkin"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 9V4.5a1.5 1.5 0 0 1 3 0V9m0-1V3.5a1.5 1.5 0 0 1 3 0V8m0 0V4.5a1.5 1.5 0 0 1 3 0V11l1.2-1.6a1.4 1.4 0 0 1 2.3 1.6L15 16.5a3 3 0 0 1-2.6 1.5H9a4 4 0 0 1-4-4V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="skins">きせかえ</span><i class="dot" id="skDot" hidden></i></button>
        <button id="toLb" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 17.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="7.5" y="5" width="5" height="12.5" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="2.5" y="10" width="5" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="12.5" y="8" width="5" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i="lb">ランキング</span></button><button id="toAch" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 2.5l3.5 6 3.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="10" cy="12.5" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10.3l.8 1.5 1.6.2-1.2 1.1.3 1.6-1.5-.8-1.5.8.3-1.6-1.2-1.1 1.6-.2z" fill="currentColor"/></svg><span data-i="ach">実績</span></button><button id="toSet"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="5" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="10" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="15" r="2.2" fill="#fff" stroke="currentColor" stroke-width="2"/></svg><span data-i="settings">設定</span></button>
      </div>
    </div>
  </div>
  <div class="ov" id="ovHow" hidden>
    <div class="card tut" id="tutCard">
      <div class="tutArt" id="tutArt"></div>
      <h2 id="tutT"></h2>
      <p id="tutB"></p>
      <div class="dots" id="tutDots"></div>
      <div class="btns"><button id="tutSkip">スキップ</button><button class="go" id="tutNext">次へ</button></div>
    </div>
  </div>
  <div class="ov" id="ovSet" hidden>
    <div class="card">
      <h2 data-i="settings">設定</h2>
      <div class="field"><span data-i="langL">言語</span>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">中文</button><button data-lang="ko">한국어</button>
        </div>
      </div>
      <div class="field"><span data-i="soundL">音</span>
        <div class="lang"><button id="snd">音 ON</button></div>
      </div>
      <button class="back" data-back data-i="back">もどる</button>
    </div>
  </div>
  <div class="ov home" id="ovSkin" hidden>
    <div></div>
    <div class="card homeDock skinCard">
      <h2 data-i="skins">きせかえ</h2>
      <div class="skRow"><span data-i="skHand">手</span><div class="skSw" id="sw-hand"></div></div>
      <div class="skRow"><span data-i="skNail">爪</span><div class="skSw" id="sw-nail"></div></div>
      <div class="skRow"><span data-i="skHair">毛</span><div class="skSw" id="sw-hair"></div></div>
      <div class="skRow"><span data-i="skBg">背景</span><div class="skSw" id="sw-bg"></div></div>
      <div class="skMsg" id="skMsg"></div>
      <button class="back" data-back data-i="back">もどる</button>
    </div>
  </div>
  <div class="ov" id="ovImg" hidden>
    <div class="card imgCard">
      <img id="shImg" alt="">
      <p data-i="saveImg">画像を長押し(PCは右クリック)して保存してください</p>
      <button class="back" id="imgBack" data-i="back">もどる</button>
    </div>
  </div>
  <div class="ov" id="ovRevive" hidden>
    <div class="card">
      <h2 data-i="revT">時間切れ!</h2>
      <p data-i="revP"></p>
      <button class="go" id="revWatch" data-i="revWatch">広告を見て+10秒</button>
      <button class="go" id="revResume" data-i="revResume" hidden>再開する</button>
      <button id="revNo" data-i="revNo">やめる</button>
      <p class="best" id="revMsg"></p>
    </div>
  </div>
  <div class="ov" id="ovPause" hidden>
    <div class="card">
      <h2 data-i="paused">一時停止</h2>
      <button class="go" id="resume" data-i="resume">つづける</button>
      <div class="btns"><button id="retry" data-i="retry">やりなおす</button><button id="toMenu" data-i="menu">メニュー</button></div>
    </div>
  </div>
  <div class="ov endOv" id="ovEnd" hidden>
    <div class="endTop"><canvas id="endFace" aria-hidden="true"></canvas><div class="say" id="endSay"></div></div>
    <div class="card endCard">
      <div class="endHead"><span id="reason"></span><span class="endLbl" data-i="score">スコア</span></div>
      <div class="big" id="fScore">0</div>
      <span class="rank" id="rank"></span>
      <span class="next" id="nextR"></span>
      <div class="rows">
        <span data-i="rN">抜いた本数</span><span id="rN">0</span>
        <span data-i="rP">スパッ!</span><span id="rP">0</span>
        <span data-i="rC">最大コンボ</span><span id="rC">0</span>
        <span data-i="rBk">ちぎれた回数</span><span id="rBk">0</span>
        <span data-i="rB">ベスト</span><span id="rB">0</span>
      </div>
      <div class="lvbox"><div class="lvrow"><b id="eLv">Lv.1</b><span id="eLvN"></span></div><div class="lvbar"><i id="eLvB"></i></div><span class="gain" id="eGain"></span></div>
      <button class="adbtn" id="dblBtn" hidden></button><div class="shareRow"><button class="xbtn" id="xBtn" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h4.2l3.6 5 4.2-5h1.8l-5.2 6.1L17.5 17h-4.2l-3.9-5.4L4.8 17H3l5.6-6.6z" fill="currentColor"/></svg><span data-i="xPost">Xでポスト</span></button><button class="sharebtn" id="shareBtn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.5V2.5M6 6l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9H3.5v8.5h13V9H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-i="share">結果をシェア</span></button></div>
      <div class="btns"><button class="go" id="again" data-i="again">もう一回</button><button id="endMenu" data-i="menu">メニュー</button></div>
    </div>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const C={tile:'#d6ebe6',grout:'#c1dad3',skin:'#f1c7a2',skinD:'#e3ad86',out:'#b97a57',crease:'#c58d69',nail:'#f7ddd0',nailE:'#e8bba8',hair:'#2a1c13',thick:'#14100c',gold:'#d6a01e',pain:'#e0412f',ink:'#1f2b33',bulb:'#fff7ee'};

function newHair(grown){
  const r=Math.random(),kind=r<0.05?'gold':r<0.27?'thick':'n';
  return {f:Math.floor(Math.random()*4),fx:rnd(-0.32,0.32),fy:rnd(0.05,0.72),ang:-Math.PI/2+rnd(-0.15,0.65),
    len:kind==='thick'?rnd(7,9):kind==='gold'?8.5:rnd(5.5,7.5),curl:rnd(-0.25,0.25),kind:feverT>0?'gold':kind,orig:kind,grow:grown?1:0};

function beep(freq,dur,type,vol){
  if(!sound||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.5,actx.currentTime+dur);g.gain.setValueAtTime(vol||0.08,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);}catch(e){}
}

  g.fillStyle=C.ink;fitText(g,L.shCta,520,40,D);g.lineWidth=8;g.strokeStyle='#fff';g.strokeText(L.shCta,cx,590);g.fillText(L.shCta,cx,590);
  return c;
}
function nat(plugin,m,o){const P=CapN.Plugins&&CapN.Plugins[plugin];if(P&&typeof P[m]==='function')return P[m](o||{});if(CapN.nativePromise)return CapN.nativePromise(plugin,m,o||{});return Promise.reject('none');}
async function doShare(){
  if(!lastRes)return;const b=$('shareBtn');b.disabled=true;
  try{
    const url=shareImg().toDataURL('image/png'),link=isNative?STORE_URL:WEB_URL,text=L.shText(lastRes.score)+' '+link;
    if(isNative){try{const w=await nat('Filesystem','writeFile',{path:'finger-fuzz.png',data:url.split(',')[1],directory:'CACHE'});await nat('Share','share',{text,files:[w.uri],dialogTitle:L.share});return;}catch(e){if(/cancel/i.test(String((e&&e.message)||e)))return;}}
    try{const blob=await (await fetch(url)).blob();const f=new File([blob],'finger-fuzz.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    $('shImg').src=url;show('ovImg');
  }finally{b.disabled=false;}
}
async function postX(){if(!lastRes)return;const tag=lang==='ja'?'指毛ぬき':'FingerFuzz';
  const touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare){const xb=$('xBtn');xb.disabled=true;
    try{const blob=await (await fetch(shareImg().toDataURL('image/png'))).blob();const f=new File([blob],'finger-fuzz.png',{type:'image/png'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:L.shText(lastRes.score)+' '+WEB_URL+' #'+tag});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}finally{xb.disabled=false;}}
  const a=document.createElement('a');a.href='https://x.com/intent/post?text='+encodeURIComponent(L.shText(lastRes.score))+'&url='+encodeURIComponent(WEB_URL)+'&hashtags='+encodeURIComponent(tag);
  a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}
$('shareBtn').onclick=doShare;$('xBtn').onclick=postX;$('imgBack').onclick=()=>show('ovEnd');
if(!isNative&&!WEB_SHARE){$('shareBtn').remove();$('xBtn').remove();}
else if(!isNative){$('xBtn').hidden=false;$('shareBtn').querySelector('span').dataset.i='imgShare';$('shareBtn').querySelector('span').textContent=L.imgShare;}

$('start').onclick=start;$('again').onclick=start;$('retry').onclick=start;

$('toHow').onclick=()=>openTut(false);$('toSkin').onclick=openSkins;$('toSet').onclick=()=>show('ovSet');

$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?L.sndOn:L.sndOff;};
applyLang();

let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(state!=='pause')update(dt);draw();requestAnimationFrame(loop);}
try{$('skDot').hidden=!(skFresh().length||localStorage.getItem('yubige-skdot'))}catch(e){}
new ResizeObserver(resize).observe($('stage'));resize();requestAnimationFrame(loop);
